[project]
name = "nitro-console"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
markers = [
    "windows: нужен Windows (драйвер, Steam) — запускается локально, не в CI",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# B027: пустые start/stop/shutdown в базовых классах — намеренно необязательные хуки плагинов
ignore = ["B008", "B027"]
