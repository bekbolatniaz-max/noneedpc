name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m ruff check server
      - run: python -m pytest -q -m "not windows"
      - run: python .verify/secret_scan.py --all

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in pwa/js/*.js; do node --check "$f"; done
      - run: node --test pwa/tests/*.test.mjs
